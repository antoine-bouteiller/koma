name: publish

on:
  push:
    branches: [main]

# Queued, never cancelled: a publish stopped mid-way can leave the APK link and the update stream out of step.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix flake check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Caches all of ../exact, not only its target: a fresh clone gets new mtimes, and cargo would rebuild its crates.
      # actions/cache refuses paths with `..`; runner.workspace is the checkout's parent.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/exact
            ${{ runner.workspace }}/exact
            target
            ~/.cache/ms-playwright
          key: exact-web-${{ runner.os }}-${{ hashFiles('.exact-ref') }}
          restore-keys: exact-web-${{ runner.os }}-
      - name: Exact checkout
        run: nix develop -c tools/exact-checkout.sh
      - name: Exact setup (web)
        run: nix develop -c bun ../exact/scripts/exact.mjs setup --platform web
      - name: Contract build
        run: nix develop -c bun exact.mjs contract build app.contract --json --errors-only
      - name: Tests (web)
        run: nix develop -c bun exact.mjs test web

  publish:
    needs: [format, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APPDROP_URL: ${{ vars.APPDROP_URL }}
      APPDROP_MANAGE_KEY: ${{ secrets.APPDROP_MANAGE_KEY }}
      EXACT_KEYSTORE_PASSWORD: ${{ secrets.EXACT_KEYSTORE_PASSWORD }}
      EXACT_KEY_ALIAS: ${{ secrets.EXACT_KEY_ALIAS }}
      EXACT_KEY_PASSWORD: ${{ secrets.EXACT_KEY_PASSWORD }}
    steps:
      # The web bake and the release APK together outgrow the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.gradle
            ~/.cache/exact
            ${{ runner.workspace }}/exact
            target
            ~/.cache/ms-playwright
          key: exact-publish-${{ runner.os }}-${{ hashFiles('.exact-ref') }}
          restore-keys: exact-publish-${{ runner.os }}-
      - name: Signing keys
        env:
          EXACT_KEYSTORE_BASE64: ${{ secrets.EXACT_KEYSTORE_BASE64 }}
          EXACT_SIGNING_KEY: ${{ secrets.EXACT_SIGNING_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/exact-keys"
          printf '%s' "$EXACT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/koma-upload.jks"
          printf '%s\n' "$EXACT_SIGNING_KEY" > "$RUNNER_TEMP/exact-keys/koma.pem"
          echo "EXACT_KEYSTORE=$RUNNER_TEMP/koma-upload.jks" >> "$GITHUB_ENV"
          echo "EXACT_SIGNING_KEY_DIR=$RUNNER_TEMP/exact-keys" >> "$GITHUB_ENV"
      - name: Exact checkout
        run: nix develop -c tools/exact-checkout.sh
      - name: Android SDK packages
        run: |
          yes | nix develop -c "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          nix develop -c "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Exact setup (Android)
        run: nix develop -c tools/exact-setup-android.sh
      # Every deploy bakes the web artifact the update bundle is made from, Android-only included.
      - name: Exact setup (web)
        run: nix develop -c bun ../exact/scripts/exact.mjs setup --platform web
      - name: Publish
        run: nix develop -c tools/publish.sh
