[versions]
android-gradle = "9.5.3"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
androidx-activity = "1.13.0"
androidx-browser = "1.10.0"
androidx-core = "1.19.1"
androidx-lifecycle = "2.11.1"
coil = "3.6.3"
material-color-utilities = "6.0.0"
